name: Weekly ratings refresh

on:
  schedule:
    - cron: '0 5 * * 1'      # Monday 05:00 UTC = 13:00 GMT+8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Force fresh ClubElo and xG snapshots
        run: python -m engine.v2.refresh

      - name: Save ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/power
          if ! git diff --staged --quiet; then
            git commit -m "Weekly ratings refresh [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

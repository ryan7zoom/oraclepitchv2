name: Daily dashboard

on:
  schedule:
    - cron: '0 4 * * *'      # once a day, UTC 04:00
  workflow_dispatch:
    inputs:
      refresh_ratings:
        description: 'Also force the weekly Elo/xG refresh before building'
        required: false
        default: 'false'

permissions:
  contents: write

# One job at a time may write to the repo.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 0. Manual full refresh (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_ratings == 'true'
        run: python -m engine.v2.refresh

      - name: 1. Update match data, closing odds and EPL injuries
        run: |
          python -m engine.data.update --espn-budget 150
          python -m engine.v2.injuries_fpl

      - name: 2. Build the v2 predictions, builder and page
        run: python -m engine.v2.run --days 3

      - name: Save to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --staged --quiet; then
            git commit -m "Daily update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

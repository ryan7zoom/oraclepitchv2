name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'      # daily test run, before the 04:00 build

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: v2 model and builder tests
        run: python tests/test_v2.py
      - name: legacy model tests
        run: python tests/test_model.py
      - name: legacy trends tests
        run: python tests/test_trends.py
      - name: data-source tests
        run: python tests/test_football_data_co_uk_source.py
